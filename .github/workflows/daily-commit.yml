name: Daily Commit
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          PATTERN=(1 2 3 4 5 5 4 3 2 1 1 2 3 4)
          DAY_INDEX=$(( $(date +%j) % 14 ))
          COUNT=${PATTERN[$DAY_INDEX]}
          git config user.name "Aryan Arora"
          git config user.email "YOUR_GITHUB_EMAIL"
          for i in $(seq 1 $COUNT); do
            echo "$(date) - $i" >> activity.log
            git add activity.log
            git commit -m "chore: log $i/$COUNT"
          done
          git push

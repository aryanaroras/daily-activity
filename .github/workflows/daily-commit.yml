name: Daily Commit
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "Aryan Arora"
          git config user.email "aryanarora.aa11@gmail.com"

          sleep $((RANDOM % 5400))

          DOW=$(date +%u)
          if [ "$DOW" -ge 6 ]; then
            MAX=3
          else
            MAX=8
          fi

          if [ $((RANDOM % 100)) -lt 12 ]; then
            echo "skip day, no commit"
            exit 0
          fi

          COUNT=$(( (RANDOM % MAX) + 1 ))

          for i in $(seq 1 $COUNT); do
            echo "$(date) - update $i" >> activity.log
            git add activity.log
            git commit -m "chore: update $i"
          done

          git push

name: Daily Commit
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date >> activity.log
          git config user.name "Aryan Arora"
          git config user.email "aryanarora.aa11@gmail.com"
          git add activity.log
          git commit -m "chore: daily log" || echo "nothing to commit"
          git push
